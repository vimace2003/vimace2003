# Generates the GitHub stats cards shown in README.md and commits them to
# profile-summary-card-output/ on the branch the run was triggered on.
# Runs daily on main, on demand, and on any branch when this file changes.
name: Profile summary cards

on:
  schedule:
    - cron: "0 6 * * *" # 03:00 in Brazil (UTC-3)
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/profile-summary-cards.yml

permissions:
  contents: write

# Queue overlapping runs on the same branch instead of cancelling them, so a
# run is never killed after it has already pushed its cards
concurrency:
  group: profile-summary-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Branch tip rather than the triggering commit, so a queued run can
          # still push after an earlier run committed new cards
          ref: ${{ github.ref_name }}

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: -3
          THEME: dracula
          # Static sites and docs would otherwise dominate the language cards
          EXCLUDE: HTML,CSS
